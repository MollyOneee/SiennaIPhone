name: QwenChat
options:
  bundleIdPrefix: com.qwenchat
targets:
  QwenChat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: QwenChat
        CFBundleDisplayName: QwenChat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenchat.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
