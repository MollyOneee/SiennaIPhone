name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build unsigned app
        run: xcodebuild -project QwenChat.xcodeproj -scheme QwenChat -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "DerivedData/Build/Products/Release-iphoneos/QwenChat.app" "Payload/QwenChat.app"
          zip -qr QwenChat.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QwenChat-ipa
          path: QwenChat.ipa
